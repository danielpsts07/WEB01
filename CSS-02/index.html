<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS02</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS com listas e tabelas</h1>

    <ul class="lista1">
        <li>item 1</li>
        <li>item 2</li>
    </ul>

    <ol class="lista2">
        <li>item 1</li>
        <li>item 2</li>
    </ol>

    <ul class="lista3">
        <li>item 1</li>
        <li>item 2</li>
    </ul>

    <table class="tabela">
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>Ana</td>
            <td>25</td>
            <td>Salvador</td>
        </tr>
        <tr>
            <td>Pedro</td>
            <td>30</td>
            <td>Recife</td>
        </tr>
    </table>
</body>
</html>
